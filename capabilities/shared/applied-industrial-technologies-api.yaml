naftiko: "1.0.0-alpha1"

info:
  label: Applied Industrial Technologies API
  description: >-
    API for the Applied Industrial Technologies product catalog and order management,
    covering industrial bearings, power transmission, fluid power, and related components.
  tags:
    - Applied Industrial Technologies
    - Industrial Distribution
    - Products
    - Orders
  created: "2026-04-19"
  modified: "2026-04-19"

binds:
  - namespace: env
    keys:
      AIT_API_TOKEN: AIT_API_TOKEN

capability:
  consumes:
    - type: http
      namespace: ait
      baseUri: "https://api.applied-industrial-technologies.com/v1"
      description: Applied Industrial Technologies product catalog and order API
      authentication:
        type: bearer
        token: "{{AIT_API_TOKEN}}"
      resources:
        - name: products
          path: /products
          description: Industrial product catalog
          operations:
            - name: list-products
              method: GET
              description: Returns a list of industrial products
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-product
              method: GET
              description: Returns a specific product by ID
              inputParameters:
                - name: productId
                  in: path
                  type: string
                  required: true
                  description: Product identifier
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: orders
          path: /orders
          description: Purchase order management
          operations:
            - name: list-orders
              method: GET
              description: Returns a list of purchase orders
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-order
              method: POST
              description: Creates a new purchase order
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  items: "{{tools.items}}"
                  shippingAddress: "{{tools.shippingAddress}}"

  exposes:
    - type: mcp
      port: 9090
      namespace: ait-mcp
      transport: http
      tools:
        - name: list-industrial-products
          description: Lists industrial products from the Applied Industrial Technologies catalog
          hints:
            readOnly: true
            idempotent: true
          call: "ait.list-products"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-industrial-product
          description: Gets details for a specific industrial product by ID
          hints:
            readOnly: true
            idempotent: true
          call: "ait.get-product"
          with:
            productId: "tools.productId"
          outputParameters:
            - type: object
              mapping: "$."

        - name: create-purchase-order
          description: Creates a new purchase order for industrial products
          hints:
            readOnly: false
            destructive: false
          call: "ait.create-order"
          with:
            items: "tools.items"
            shippingAddress: "tools.shippingAddress"
          outputParameters:
            - type: object
              mapping: "$."
