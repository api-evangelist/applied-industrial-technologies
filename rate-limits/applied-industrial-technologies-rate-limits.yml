  Evangelist bulk-sweep scaffold dated 2026-05-04 that asserted X-RateLimit-Limit /
  X-RateLimit-Remaining / X-RateLimit-Reset / RateLimit-Policy headers and a 429
  response the provider has never published. Those values were invented and have been
  removed. No rate-limit documentation exists: there is no developer portal and no API
  reference. The live Azure API Management gateway at api.applied.com returns only a
  54-byte JSON 404 on every probed path and emits no RateLimit-* or Retry-After header
  on an anonymous request, so nothing could be observed at runtime either.
