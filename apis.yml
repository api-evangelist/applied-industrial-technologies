description: >-
  Applied Industrial Technologies, Inc. (NYSE: AIT) is a Cleveland, Ohio industrial
  distributor and technical solutions provider, founded in 1923, serving MRO and OEM
  customers across North America, Australia, New Zealand and Singapore. It distributes
  bearings, power transmission products, fluid power components, industrial rubber
  products, linear motion components, specialty flow control, tools and related
  supplies, and operates engineered fluid power and automation businesses alongside
  its distribution network. Its customer-facing storefront is applied.com, an SAP
  Commerce site; the company runs an Azure API Management gateway at api.applied.com
  but publishes no public developer program, API reference or machine-readable contract.
